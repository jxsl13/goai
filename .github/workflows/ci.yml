# GoAI CI (§V4/§V7/§V23, rebuilt for the initial public push in §T562).
#
# Design informed by the reference Go repos:
#   - gomlx:    -short on runners (full suites are for dev boxes), workflow_dispatch
#   - gorgonia: -race with explicit -timeout
#   - ollama:   multi-OS tests, `go mod tidy` drift check, PR concurrency cancel
#   - spago:    go vet + atomic coverage profile
#
# The -short suite is the repo's designed fast path: every trained-model e2e is
# -short-skipped, everything else runs — 24 packages, ~19s locally with cgo,
# ~11s pure-Go, 75.1% statement coverage. GPU suites self-skip when no device is
# present (metal.Available() guards); vulkan is tag-gated (needs MoltenVK/ICDs on
# dev boxes) and is compile-checked here.

name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.head_ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  # Impact gate (§T579/§T580): internal/cichange -impact maps the diff to exactly
  # the packages whose tests are affected — "none" (docs-only: skip everything),
  # "all" (global reach: full suite), or a package list (test just those). Every
  # uncertainty fails open to "all" (§V26); a shell-level `|| echo all` is the
  # second fail-open layer. Soundness backstop: the test jobs still `go vet ./...`
  # in full, so under-selection can never hide a compile break (§V23).
  changes:
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.classify.outputs.code }}
      affected: ${{ steps.classify.outputs.affected }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # classify needs the base revision
      - uses: actions/setup-go@v6
        with:
          go-version: "1.26.x"
          cache: false
      - name: download dependencies (no-op while the module is zero-dep, §T582)
        run: go mod download
      - id: classify
        run: |
          BASE="${{ github.event.pull_request.base.sha || github.event.before }}"
          AFFECTED=$(go run ./internal/cichange -impact "$BASE" HEAD || echo all)
          echo "affected=$AFFECTED" | tee -a "$GITHUB_STEP_SUMMARY"
          echo "affected=$AFFECTED" >> "$GITHUB_OUTPUT"
          if [ "$AFFECTED" = "none" ]; then
            echo "code=false" >> "$GITHUB_OUTPUT"
          else
            echo "code=true" >> "$GITHUB_OUTPUT"
          fi

  # §V4/§V7/§V23 — the portable promise: the whole library builds, vets (which
  # compiles _test.go files, §B45) and tests WITHOUT a C toolchain, on all
  # three OSes. This is the gate every local iteration runs; now enforced on push.
  pure-go:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    name: pure-go / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    env:
      CGO_ENABLED: "0"
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # the transparent runner recomputes the selection itself (§T587)
      - uses: actions/setup-go@v6
        with:
          go-version: "1.26.x"
          cache: false # zero-dependency module (no go.sum): nothing to cache
      - name: vet (compiles tests too — §V23; always full, the soundness backstop)
        run: go vet ./...
      - name: test (transparent selective run, §T587)
        shell: bash
        run: |
          BASE="${{ github.event.pull_request.base.sha || github.event.before }}"
          go run ./internal/cichange -run "$BASE" HEAD -- -short -count=1 -timeout 10m
      # §V5: benchmarks must at least build and run one iteration.
      - name: bench-smoke
        shell: bash
        run: |
          BASE="${{ github.event.pull_request.base.sha || github.event.before }}"
          go run ./internal/cichange -run "$BASE" HEAD -- -run='^$' -bench=. -benchtime=1x -timeout 10m

  # cgo on linux: the optimized CPU backend under the RACE detector (the §T511
  # worker pool's standing guard, §B49-class bugs), plus gofmt and coverage.
  test-linux-cgo:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    name: cgo+race / ubuntu
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # §T587
      - uses: actions/setup-go@v6
        with:
          go-version: "1.26.x"
          cache: false
      - name: gofmt
        run: |
          out=$(gofmt -l .)
          if [ -n "$out" ]; then
            echo "gofmt needed on:" && echo "$out" && exit 1
          fi
      - name: vet
        run: go vet ./...
      - name: test (race, transparent selective run, §T587)
        run: |
          BASE="${{ github.event.pull_request.base.sha || github.event.before }}"
          go run ./internal/cichange -run "$BASE" HEAD -- -short -count=1 -race -timeout 20m
      - name: coverage
        run: |
          BASE="${{ github.event.pull_request.base.sha || github.event.before }}"
          go run ./internal/cichange -run "$BASE" HEAD -- -short -count=1 -covermode=atomic -coverprofile=coverage.out
          go tool cover -func=coverage.out | tail -1 | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: coverage.out

  # darwin cgo: compiles the tag-free Metal backend (ADR-0013) and runs the
  # -short suite. macOS arm64 runners expose a paravirtualized Metal GPU, so
  # the metal tests run for real where available and self-skip otherwise.
  test-macos-cgo:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    name: cgo+metal / macos
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # §T587
      - uses: actions/setup-go@v6
        with:
          go-version: "1.26.x"
          cache: false
      - name: capability probe (§T601 — what does this runner offer?)
        run: go run ./internal/capprobe
      - name: vet (compiles the metal cgo backend)
        run: go vet ./...
      - name: test (transparent selective run, §T587)
        run: |
          BASE="${{ github.event.pull_request.base.sha || github.event.before }}"
          go run ./internal/cichange -run "$BASE" HEAD -- -short -count=1 -timeout 20m

  # §T604 capability matrix, vulkan axis: the tagged backend compiles on every
  # OS and its tests EXECUTE wherever an ICD is installable — Mesa lavapipe on
  # linux, MoltenVK on macOS, the LunarG runtime on windows (best effort). A
  # capability probe (§T601) prints first; absent capability → transparent rc=0
  # skip. Cross-driver divergences are the goal, not a nuisance (§T603).
  vulkan:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    name: vulkan / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # the selector decides whether the vulkan tests run (§T600)
      - uses: actions/setup-go@v6
        with:
          go-version: "1.26.x"
          cache: false
      - name: install ICD (linux — Mesa lavapipe)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libvulkan-dev vulkan-tools mesa-vulkan-drivers
      - name: install ICD (macos — MoltenVK)
        if: runner.os == 'macOS'
        continue-on-error: true
        run: |
          brew install --quiet molten-vk vulkan-headers vulkan-loader vulkan-tools
          echo "VK_ICD_FILENAMES=$(brew --prefix)/share/vulkan/icd.d/MoltenVK_icd.json" >> "$GITHUB_ENV"
          echo "DYLD_LIBRARY_PATH=$(brew --prefix)/lib" >> "$GITHUB_ENV"
      - name: install ICD (windows — LunarG runtime, best effort)
        if: runner.os == 'Windows'
        continue-on-error: true
        run: choco install -y --no-progress vulkan-sdk
      - name: capability probe (§T601 — what does this runner offer?)
        shell: bash
        run: go run ./internal/capprobe
      - name: build
        shell: bash
        run: go build -tags vulkan ./...
      - name: test (only when the change touches the vulkan backend, §T600)
        shell: bash
        run: |
          BASE="${{ github.event.pull_request.base.sha || github.event.before }}"
          AFFECTED=$(go run ./internal/cichange -impact "$BASE" HEAD || echo all)
          case "$AFFECTED" in
            all|*backend/vulkan*) ;;
            *) echo "skip: change does not touch backend/vulkan (affected: $AFFECTED) — rc=0"; exit 0;;
          esac
          if ! vulkaninfo --summary >/dev/null 2>&1; then
            echo "skip: no loadable Vulkan ICD on this runner — rc=0"; exit 0
          fi
          if vulkaninfo --summary 2>/dev/null | grep -qiE "llvmpipe|swiftshader"; then
            export GOAI_VULKAN_SOFTWARE_ICD=1  # software ICD: known-divergent tests self-skip with reasons (T603)
          fi
          go test -tags vulkan -short -count=1 -timeout 15m -v ./backend/vulkan/ > vk.log 2>&1
          rc=$?  # un-piped exit code (V24); the excerpt below is display-only
          grep -E "^(--- (PASS|FAIL|SKIP)|ok |FAIL)|skipped:" vk.log | head -60 || true
          exit $rc

  # go.mod stays tidy (ollama pattern; zero-dep module today, this guards drift).
  tidy:
    name: go mod tidy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version: "1.26.x"
          cache: false
      - name: drift check
        run: |
          go mod tidy
          git diff --exit-code go.mod

  # §T604 capability matrix, simd axis: the GOEXPERIMENT=simd build on every
  # amd64 OS (windows included); arm64 runners skip transparently — their SIMD
  # class (NEON) is served by the default build. Soft gate until §T11b lands.
  simd:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    name: simd / ${{ matrix.os }} (soft)
    runs-on: ${{ matrix.os }}
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version: "1.26.x"
          cache: false
      - name: capability probe (§T601 — what does this runner offer?)
        shell: bash
        run: go run ./internal/capprobe
      - name: build (GOEXPERIMENT=simd, amd64 only)
        shell: bash
        env:
          CGO_ENABLED: "0"
        run: |
          if [ "$(go env GOARCH)" != "amd64" ]; then
            echo "skip: GOEXPERIMENT=simd is amd64-only; this runner is $(go env GOARCH) (NEON served by the default build) — rc=0"
            exit 0
          fi
          GOEXPERIMENT=simd go build -tags=simd ./...

  # §T604 capability matrix, cgo axis on windows (mingw): the tagless cgo build
  # must behave like everywhere else; tests run selectively via the runner.
  test-windows-cgo:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    name: cgo / windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # §T587
      - uses: actions/setup-go@v6
        with:
          go-version: "1.26.x"
          cache: false
      - name: capability probe (§T601 — what does this runner offer?)
        shell: bash
        run: go run ./internal/capprobe
      - name: vet (cgo enabled)
        shell: bash
        env:
          CGO_ENABLED: "1"
        run: go vet ./...
      - name: test (transparent selective run, §T587)
        shell: bash
        env:
          CGO_ENABLED: "1"
        run: |
          BASE="${{ github.event.pull_request.base.sha || github.event.before }}"
          go run ./internal/cichange -run "$BASE" HEAD -- -short -count=1 -timeout 20m
