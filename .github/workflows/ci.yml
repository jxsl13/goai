# GoAI CI (§V4/§V7/§V23, rebuilt for the initial public push in §T562).
#
# Design informed by the reference Go repos:
#   - gomlx:    -short on runners (full suites are for dev boxes), workflow_dispatch
#   - gorgonia: -race with explicit -timeout
#   - ollama:   multi-OS tests, `go mod tidy` drift check, PR concurrency cancel
#   - spago:    go vet + atomic coverage profile
#
# The -short suite is the repo's designed fast path: every trained-model e2e is
# -short-skipped, everything else runs — 24 packages, ~19s locally with cgo,
# ~11s pure-Go, 75.1% statement coverage. GPU suites self-skip when no device is
# present (metal.Available() guards); vulkan is tag-gated (needs MoltenVK/ICDs on
# dev boxes) and is compile-checked here.

name: ci

on:
  push:
    branches: [main]
    # C16 exception 2 / T609: pure-docs pushes start NO runner at all. These
    # patterns mirror the selector's default doc classification exactly —
    # root-level markdown and the docs tree; deeper .md files still trigger
    # (they can be //go:embed'ed, the B50 lesson).
    paths-ignore:
      - "*.md"
      - "docs/**"
      - ".claude/**"
      # spec/ is the §V40 source tree for the generated SPEC.md views — pure
      # markdown, contains no Go packages and is never //go:embed-ed (the B50
      # concern is package-adjacent md), same reasoning as docs/**.
      - "spec/**"
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.head_ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  # Impact gate (§T579/§T580): internal/cichange -impact maps the diff to exactly
  # the packages whose tests are affected — "none" (docs-only: skip everything),
  # "all" (global reach: full suite), or a package list (test just those). Every
  # uncertainty fails open to "all" (§V26); a shell-level `|| echo all` is the
  # second fail-open layer. Soundness backstop: the test jobs still `go vet ./...`
  # in full, so under-selection can never hide a compile break (§V23).
  changes:
    name: select affected packages (cichange)
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.classify.outputs.code }}
      affected: ${{ steps.classify.outputs.affected }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # classify needs the base revision
      - uses: actions/setup-go@v6
        with:
          go-version: "1.26.x"
          cache: false
      - uses: ./.github/actions/go-build-cache
        with:
          lane: changes
      - name: go mod download (a no-op today — zero-dependency module, §T582)
        run: go mod download
      - id: classify
        name: compute the affected package set from this push's diff
        run: |
          BASE="${{ github.event.pull_request.base.sha || github.event.before }}"
          AFFECTED=$(go run ./internal/cichange -impact "$BASE" HEAD || echo all)
          echo "affected=$AFFECTED" | tee -a "$GITHUB_STEP_SUMMARY"
          echo "affected=$AFFECTED" >> "$GITHUB_OUTPUT"
          if [ "$AFFECTED" = "none" ]; then
            echo "code=false" >> "$GITHUB_OUTPUT"
          else
            echo "code=true" >> "$GITHUB_OUTPUT"
          fi

  # §V4/§V7/§V23 — the portable promise: the whole library builds, vets (which
  # compiles _test.go files, §B45) and tests WITHOUT a C toolchain, on all
  # three OSes. This is the gate every local iteration runs; now enforced on push.
  pure-go:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    name: pure-go / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    env:
      CGO_ENABLED: "0"
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # the transparent runner recomputes the selection itself (§T587)
      - uses: actions/setup-go@v6
        with:
          go-version: "1.26.x"
          cache: false # zero-dependency module (no go.sum): nothing to cache
      - uses: ./.github/actions/go-build-cache
        with:
          lane: pure-go-${{ matrix.os }}
      - name: compile EVERYTHING incl. tests via go vet (full-tree soundness backstop, §V23)
        run: go vet ./...
      - name: run tests for the affected packages only (transparent selective runner, §T587)
        shell: bash
        run: |
          BASE="${{ github.event.pull_request.base.sha || github.event.before }}"
          go run ./internal/cichange -run "$BASE" HEAD -- -short -count=1 -timeout 10m
      # §V5: benchmarks must at least build and run one iteration.
      - name: smoke-run every benchmark once (they must at least build+run, §V5)
        shell: bash
        run: |
          BASE="${{ github.event.pull_request.base.sha || github.event.before }}"
          go run ./internal/cichange -run "$BASE" HEAD -- -run='^$' -bench=. -benchtime=1x -timeout 10m

  # cgo on linux: the optimized CPU backend under the RACE detector (the §T511
  # worker pool's standing guard, §B49-class bugs), plus gofmt and coverage.
  test-linux-cgo:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    name: cgo+race / ubuntu
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # §T587
      - uses: actions/setup-go@v6
        with:
          go-version: "1.26.x"
          cache: false
      - uses: ./.github/actions/go-build-cache
        with:
          lane: cgo-race
      - name: gofmt check (unformatted code fails the build)
        run: |
          out=$(gofmt -l .)
          if [ -n "$out" ]; then
            echo "gofmt needed on:" && echo "$out" && exit 1
          fi
      # The npy/npz cross-checks locate python at ../../.venv/bin/python and
      # t.Skip when it is absent — so before this step they had NEVER run in CI,
      # and a green pipeline said nothing about whether a file GoAI writes is
      # readable by the reference numpy (the write direction; the read direction
      # is covered by committed fixtures). See §V16.
      #
      # Deliberately non-fatal: if PyPI is unreachable the venv is simply absent
      # and those tests skip exactly as they did before, so this step can never
      # redden a lane for a reason unrelated to the change under test. It is
      # strictly better than the previous state and never worse.
      - name: numpy venv for the .npy/.npz cross-checks (best-effort, never fatal)
        continue-on-error: true
        run: |
          python3 -m venv .venv && ./.venv/bin/pip install --quiet --disable-pip-version-check numpy
          ./.venv/bin/python -c "import numpy; print('numpy', numpy.__version__)"
      - name: compile everything incl. tests via go vet (§V23)
        run: go vet ./...
      # NOTE on the cuda test corpus, deliberately NOT added here. llamagpu's 56
      # cuda test files are `//go:build cuda && cgo && (linux || windows)` and
      # import backend/cuda, so compiling them on this ubuntu lane would require the
      # CUDA toolkit headers, which the runner does not have — the step would fail
      # for a reason unrelated to the change under test. (Running `go vet -tags
      # cuda` on darwin instead only LOOKS clean: the OS constraint excludes every
      # one of those files, so it compiles nothing. Verified by injecting a syntax
      # error and watching it pass.) Syntax rot in those files IS caught, by the
      # tree-wide gofmt step above, which parses regardless of build tags; type and
      # API rot is covered by the dedicated cuda-compile lane below (T866, ADR-0029),
      # which provisions the toolkit; running the corpus still needs real silicon.
      - name: race-detector tests for the affected packages (§T587)
        run: |
          BASE="${{ github.event.pull_request.base.sha || github.event.before }}"
          go run ./internal/cichange -run "$BASE" HEAD -- -short -count=1 -race -timeout 20m
      - name: coverage over the affected packages (summary line in the job page)
        run: |
          BASE="${{ github.event.pull_request.base.sha || github.event.before }}"
          go run ./internal/cichange -run "$BASE" HEAD -- -short -count=1 -covermode=atomic -coverprofile=coverage.out
          go tool cover -func=coverage.out | tail -1 | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: coverage.out
          # an empty selection legitimately produces no coverage.out (C17: the
          # "No files were found" warning is expected there, not a defect)
          if-no-files-found: ignore

  # darwin cgo: compiles the tag-free Metal backend (ADR-0013) and runs the
  # -short suite. macOS arm64 runners expose a paravirtualized Metal GPU, so
  # the metal tests run for real where available and self-skip otherwise.
  test-macos-cgo:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    name: cgo+metal / macos
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # §T587
      - uses: actions/setup-go@v6
        with:
          go-version: "1.26.x"
          cache: false
      - uses: ./.github/actions/go-build-cache
        with:
          lane: cgo-metal
      - name: capability probe (§T601 — what does this runner offer?)
        run: go run ./internal/capprobe
      - name: compile everything incl. the Metal cgo backend via go vet
        run: go vet ./...
      - name: test (transparent selective run, §T587)
        run: |
          BASE="${{ github.event.pull_request.base.sha || github.event.before }}"
          go run ./internal/cichange -run "$BASE" HEAD -- -short -count=1 -timeout 20m

  # §T866 / ADR-0029 — the cuda axis. Closes the type/API-rot gap that ADR-0029
  # first recorded as unclosable: 56 llamagpu cuda test files plus backend/cuda
  # itself were never compiled by CI, because `go vet ./...` has the wrong tags and
  # the runners had no CUDA headers.
  #
  # No GPU is needed and none is used. The kernels are compiled at RUNTIME via
  # nvrtc (backend/cuda/cuda.go:341) and the WMMA .cu files ship as a committed
  # fatbin, so nothing here invokes nvcc — headers and link stubs are enough to
  # typecheck and link the whole tagged tree. `-lcuda` resolves against the driver
  # STUB the toolkit ships in lib64/stubs, which exists precisely so CUDA software
  # can be built on machines with no driver.
  #
  # This lane can therefore catch a signature drift, a renamed symbol or a bad cgo
  # binding. It CANNOT catch a wrong number — executing the cuda corpus needs real
  # silicon, which remains out of scope (ADR-0029's third row).
  cuda-compile:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    name: cuda compile+link / ubuntu
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v6
        with:
          go-version: "1.26.x"
          cache: false
      - uses: ./.github/actions/go-build-cache
        with:
          lane: cuda-compile
      # NVIDIA's own apt repo, no third-party action — this repo does not take
      # dependencies it does not have to (§C1), and a build-time supply chain is
      # still a supply chain. Only the dev subset is installed (headers + import
      # libs + nvrtc), not the ~3 GB full toolkit: nvcc is not needed, per above.
      - name: install the CUDA dev subset (headers + link libs; no driver, no GPU)
        run: |
          set -euxo pipefail
          . /etc/os-release
          distro="ubuntu${VERSION_ID//./}"
          wget -q "https://developer.download.nvidia.com/compute/cuda/repos/${distro}/x86_64/cuda-keyring_1.1-1_all.deb"
          sudo dpkg -i cuda-keyring_1.1-1_all.deb
          sudo apt-get update -qq
          # cuda-nvcc is required for its HEADERS, not the compiler: cuda_runtime.h
          # line 82 includes crt/host_config.h, and the whole include/crt/ tree
          # ships in the nvcc package. Installing cudart-dev alone fails with
          # "fatal error: crt/host_config.h: No such file or directory" — nvcc
          # itself is still never invoked (kernels build at runtime via nvrtc).
          sudo apt-get install -y --no-install-recommends \
            cuda-cudart-dev-12-6 libcublas-dev-12-6 cuda-nvrtc-dev-12-6 cuda-nvcc-12-6
          ls /usr/local/cuda-12.6/include/cuda_runtime.h /usr/local/cuda-12.6/include/crt/host_config.h
      - name: compile+link the cuda-tagged tree (typecheck, then link the test binaries)
        env:
          CGO_CFLAGS: -I/usr/local/cuda-12.6/include
          CGO_LDFLAGS: -L/usr/local/cuda-12.6/lib64 -L/usr/local/cuda-12.6/lib64/stubs
        run: |
          set -euxo pipefail
          go vet -tags cuda ./backend/cuda/ ./llamagpu/
          # -c links the test binary without running it: proves the LDFLAGS and every
          # extern symbol actually resolve, which vet alone does not.
          go test -c -tags cuda -o /dev/null ./llamagpu/
          go test -c -tags cuda -o /dev/null ./backend/cuda/

  # §T604 capability matrix, vulkan axis: the tagged backend compiles on every
  # OS and its tests EXECUTE wherever an ICD is installable — Mesa lavapipe on
  # linux, MoltenVK on macOS, the LunarG runtime on windows (best effort). A
  # capability probe (§T601) prints first; absent capability → transparent rc=0
  # skip. Cross-driver divergences are the goal, not a nuisance (§T603).
  vulkan:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    name: vulkan / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # the selector decides whether the vulkan tests run (§T600)
      - uses: actions/setup-go@v6
        with:
          go-version: "1.26.x"
          cache: false
      - uses: ./.github/actions/go-build-cache
        with:
          lane: vulkan-${{ matrix.os }}
      - name: install ICD (linux — Mesa lavapipe)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libvulkan-dev vulkan-tools mesa-vulkan-drivers
      - name: install ICD (macos — MoltenVK)
        if: runner.os == 'macOS'
        continue-on-error: true
        run: |
          # C17 hygiene: the runner image ships an untrusted aws/tap that brew
          # warns about on every install — drop it (we use homebrew-core only);
          # NO_ENV_HINTS silences the remaining env hints
          brew untap aws/tap 2>/dev/null || true
          HOMEBREW_NO_ENV_HINTS=1 brew install --quiet molten-vk vulkan-headers vulkan-loader vulkan-tools
          echo "VK_ICD_FILENAMES=$(brew --prefix)/share/vulkan/icd.d/MoltenVK_icd.json" >> "$GITHUB_ENV"
          echo "DYLD_LIBRARY_PATH=$(brew --prefix)/lib" >> "$GITHUB_ENV"
      - name: install ICD (windows — LunarG runtime, best effort)
        if: runner.os == 'Windows'
        continue-on-error: true
        run: choco install -y --no-progress vulkan-sdk
      - name: capability probe (§T601 — what does this runner offer?)
        shell: bash
        run: go run ./internal/capprobe
      - name: compile the vulkan-tagged tree
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            # `|| true`: under `bash -e -o pipefail`, ls exiting 2 on a missing
            # SDK dir would abort the whole step before the skip-guard below runs.
            SDK=$(ls -d /c/VulkanSDK/* 2>/dev/null | head -1 || true)
            if [ -z "$SDK" ]; then
              echo "skip: no Vulkan SDK headers on this runner — build skipped, rc=0"; exit 0
            fi
            echo "CGO_CFLAGS=-I$SDK/Include" >> "$GITHUB_ENV"
            echo "CGO_LDFLAGS=-L$SDK/Lib" >> "$GITHUB_ENV"
            export CGO_CFLAGS="-I$SDK/Include" CGO_LDFLAGS="-L$SDK/Lib"
          fi
          go build -tags vulkan ./...
          # `go build` skips _test.go entirely, so llamagpu's vulkan-tagged test
          # files were compiled by nothing — they could rot indefinitely while this
          # lane stayed green. `go vet` does compile them. Verified non-vacuous by
          # injecting a syntax error and confirming it is caught (unlike the cuda
          # corpus, whose OS constraint makes the same check compile nothing — see
          # the note in the cgo lane and ADR-0029).
          go vet -tags vulkan ./llamagpu/
      - name: run backend/vulkan tests — only if this change touches it AND an ICD is present (§T600)
        shell: bash
        run: |
          BASE="${{ github.event.pull_request.base.sha || github.event.before }}"
          AFFECTED=$(go run ./internal/cichange -impact "$BASE" HEAD || echo all)
          case "$AFFECTED" in
            all|*backend/vulkan*) ;;
            *) echo "skip: change does not touch backend/vulkan (affected: $AFFECTED) — rc=0"; exit 0;;
          esac
          if ! vulkaninfo --summary >/dev/null 2>&1; then
            echo "skip: no loadable Vulkan ICD on this runner — rc=0"; exit 0
          fi
          if vulkaninfo --summary 2>/dev/null | grep -qiE "llvmpipe|swiftshader"; then
            export GOAI_VULKAN_SOFTWARE_ICD=1  # software ICD: known-divergent tests self-skip with reasons (T603)
          fi
          # `|| rc=$?` keeps the un-piped exit code (V24) AND survives bash -e: a bare
          # failing command would abort the script before the log excerpt ever prints —
          # exactly on failure, when the excerpt matters most (B53).
          rc=0
          go test -tags vulkan -short -count=1 -timeout 15m -v ./backend/vulkan/ > vk.log 2>&1 || rc=$?
          grep -E "^(--- (PASS|FAIL|SKIP)|ok |FAIL)|skipped:" vk.log | head -80 || true
          exit $rc

  # go.mod stays tidy (ollama pattern; zero-dep module today, this guards drift).
  tidy:
    name: go mod tidy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version: "1.26.x"
          cache: false
      - uses: ./.github/actions/go-build-cache
        with:
          lane: tidy
      - name: go mod tidy must not change go.mod (dependency drift gate)
        run: |
          go mod tidy
          git diff --exit-code go.mod

  # §T604 capability matrix, simd axis: the GOEXPERIMENT=simd build on every
  # amd64 OS (windows included); arm64 runners skip transparently — their SIMD
  # class (NEON) is served by the default build. Soft gate until §T11b lands.
  simd:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    name: simd / ${{ matrix.os }} (soft)
    runs-on: ${{ matrix.os }}
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version: "1.26.x"
          cache: false
      - uses: ./.github/actions/go-build-cache
        with:
          lane: simd-${{ matrix.os }}
      - name: capability probe (§T601 — what does this runner offer?)
        shell: bash
        run: go run ./internal/capprobe
      - name: compile with GOEXPERIMENT=simd (amd64 runners; arm64 skips transparently)
        shell: bash
        env:
          CGO_ENABLED: "0"
        run: |
          if [ "$(go env GOARCH)" != "amd64" ]; then
            echo "skip: GOEXPERIMENT=simd is amd64-only; this runner is $(go env GOARCH) (NEON served by the default build) — rc=0"
            exit 0
          fi
          GOEXPERIMENT=simd go build -tags=simd ./...

  # §T604 capability matrix, cgo axis on windows (mingw): the tagless cgo build
  # must behave like everywhere else; tests run selectively via the runner.
  test-windows-cgo:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    name: cgo / windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # §T587
      - uses: actions/setup-go@v6
        with:
          go-version: "1.26.x"
          cache: false
      - uses: ./.github/actions/go-build-cache
        with:
          lane: cgo-windows
      - name: capability probe (§T601 — what does this runner offer?)
        shell: bash
        run: go run ./internal/capprobe
      - name: compile everything with cgo enabled via go vet (mingw)
        shell: bash
        env:
          CGO_ENABLED: "1"
        run: go vet ./...
      - name: test (transparent selective run, §T587)
        shell: bash
        env:
          CGO_ENABLED: "1"
        run: |
          BASE="${{ github.event.pull_request.base.sha || github.event.before }}"
          go run ./internal/cichange -run "$BASE" HEAD -- -short -count=1 -timeout 20m
