name: ci

on:
  push:
    branches: [main]
  pull_request:

# §V4 PLATFORM: Pure-Go build must stay green on macOS, Windows, Linux.
# §V7 CGO: CGO_ENABLED=0 everywhere — no C toolchain in the ship path.
env:
  CGO_ENABLED: "0"

jobs:
  pure-go:
    name: pure-go / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.x"
      - name: build
        run: go build ./...
      - name: vet
        run: go vet ./...
      - name: test
        run: go test ./...
      # §V5: benchmarks must at least build+run (perf-regression gate via
      # benchstat is future work, §B30).
      - name: bench-smoke
        run: go test -run=^$ -bench=. -benchtime=1x ./...

  # §T11: experimental SIMD backend (AMD64). Allowed to be a soft gate until
  # the simd/archsimd API stabilizes (§R1); does not block the pure-go gate.
  simd-amd64:
    name: simd / ubuntu-amd64
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.x"
      - name: build (GOEXPERIMENT=simd)
        run: GOEXPERIMENT=simd go build -tags=simd ./...
        env:
          CGO_ENABLED: "0"
