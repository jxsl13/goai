# spec-sync (§V40): SPEC.md + SPEC-worker-*.md are GENERATED views of the
# spec/ source tree. This job ALWAYS re-renders the views from spec/ and
# fails on any byte diff — with an explicit pointer to the editing utility.
#
# It lives outside ci.yml on purpose: ci.yml's push paths-ignore skips all
# markdown (docs-only pushes start zero heavy runners, §C16 EXC2), which
# would let a hand-edited SPEC.md slide until the next code push. This job
# has its own narrow path filter, so every push touching the spec corpus
# gets the render-sync gate — and nothing else pays for it.

name: spec-sync

on:
  push:
    paths:
      - "spec/**"
      - "SPEC.md"
      - "SPEC-worker-*.md"
      - "FORMAT.md"
      - "internal/specgraph/**"
  pull_request:
    paths:
      - "spec/**"
      - "SPEC.md"
      - "SPEC-worker-*.md"
      - "FORMAT.md"
      - "internal/specgraph/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  render-check:
    name: render views from spec/ and diff (§V40)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: regenerate SPEC.md + SPEC-worker-*.md from spec/ and fail on any diff
        run: |
          if ! CGO_ENABLED=0 go run ./internal/specgraph render -check; then
            echo "::error title=spec out of sync (§V40)::SPEC.md / SPEC-worker-*.md are GENERATED views of spec/ — never edit them by hand."
            echo "::error::Mutate entries ONLY via the utility: go run ./internal/specgraph  (task add | task set-status | task edit | bug add | verif add | research add | goal/constraint/archinv add/edit | entry rm)."
            echo "::error::Prose sections: edit the spec/ fragment directly, then regenerate with 'make spec-render'. Validate locally with 'make spec-verify'."
            exit 1
          fi
      - name: full spec verify (V36 ids, table shapes, V39 dangling strong refs)
        run: CGO_ENABLED=0 go run ./internal/specgraph verify
