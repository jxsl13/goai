name: go-build-cache
description: >-
  Persist the Go BUILD cache (GOCACHE) across runs (SPEC T605/R238). The module
  is zero-dependency, so module caching is pointless — but every lane
  full-compiles the tree, and warm compiled objects cut that dramatically.
  Compiled-object caching never skips a test, so quality is untouched.
inputs:
  lane:
    description: distinct lane name for the cache key (job + matrix flavor)
    required: true
runs:
  using: composite
  steps:
    - id: paths
      shell: bash
      run: echo "gocache=$(go env GOCACHE)" >> "$GITHUB_OUTPUT"
    - uses: actions/cache@v6
      with:
        path: ${{ steps.paths.outputs.gocache }}
        key: gobuild-${{ runner.os }}-${{ inputs.lane }}-${{ github.sha }}
        restore-keys: |
          gobuild-${{ runner.os }}-${{ inputs.lane }}-
