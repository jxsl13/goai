# GoAI vocabulary for github.com/jxsl13/perfscan/perfscan.
# Language and standard-library checks need no configuration. These names enable
# tensor/domain-aware checks without baking GoAI concepts into the external tool.
elementAccessors: [AtF64, SetF64]
fastPathHelpers: [flatF64, flatF32, flatContig, F64, F32]
elementCountMethods: [Numel]
shapeMethods: [Shape]
indexDecomposeFuncs: [Unravel]
allocatorFuncs: [New, NewOn, FromFloat64, FromFloat32, Zeros, Ones, Full, Scalar, scalarTensor, Cast]
perElementVisitors: [readGen, fillGen, visitGen, forEach, eachElem]
bulkCopyHelpers: [rawCopyLE, rawStoreLE]
vectorizedSiblingFuncs:
  - vexpF32
  - vexpFullF32
  - vexpRowF32
  - vexpQuadsNeonF32
  - vexpFullQuadsNeonF32
  - vsiluF32
  - vsiluF64
  - vsiluGradF32
  - vsiluQuadsNeonF32
  - vsiluGradQuadsNeonF32
  - vgeluF32
  - vgeluGradF32
  - vgeluQuadsNeonF32
  - vgeluGradQuadsNeonF32
  - vtanhF32
  - vtanhQuadsNeonF32
  - vlogF32
  - vlogQuadsNeonF32
  - vsigmoidF32
  - vsigmoidQuadsNeonF32
  - vsoftplusF64
  - vsoftcapF64
  - vMaxF32
  - varSumF32
  - expF64x4
  - softplusF64x4
  - horizF64x4
  - max8
fanOutHelpers: [parallel, parallelChunks, parallelCols]
dtypeMethods: [Dtype]
